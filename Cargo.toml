[package]
name = "promptforge"
version = "0.3.0"
edition = "2021"

[features]
default = ["gtk4"]
gtk4 = [
    "dep:tauri",
    "dep:tauri-plugin-fs",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-clipboard-manager",
]
# 互換レイヤー追加時の集約用エイリアス。新規レイヤーは gtk4 へ統合すること。
gtk4_compat = ["gtk4"]
security = ["dep:glib_security"]

[dependencies]
tauri = { version = "2", features = [], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
futures-util = "0.3"
tauri-plugin-fs = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }
glib_security = { package = "glib", version = "0.20", optional = true }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
insta = "1"
tempfile = "3"

[[test]]
name = "glib_stack"
path = "tests/security/glib_stack.rs"
required-features = ["security"]

[[test]]
name = "plugin_registration"
path = "tests/plugin_registration.rs"
required-features = ["gtk4"]

[[test]]
name = "workspace_backup"
path = "tests/workspace_backup.rs"
required-features = ["gtk4"]

[[test]]
name = "compose_prompt_snapshot"
path = "tests/compose_prompt_snapshot.rs"
required-features = ["gtk4"]

[[test]]
name = "project_file_io"
path = "tests/project_file_io.rs"
required-features = ["gtk4"]

[[test]]
name = "project_io"
path = "tests/project_io.rs"
required-features = ["gtk4"]

[[test]]
name = "prompt_files"
path = "tests/prompt_files.rs"
required-features = ["gtk4"]

[patch.crates-io]
tao = { git = "https://github.com/tauri-apps/tao", branch = "dev" }
wry = { git = "https://github.com/tauri-apps/wry", branch = "dev" }
