name: links
on:
  pull_request:
  schedule: [{ cron: "0 3 * * 1" }]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions: { contents: read, issues: write }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        # lychee v0.20.x 莉･髯阪〒縺ｯ --exclude-mail 縺悟ｻ・ｭ｢縺輔ｌ縺ｦ縺翫ｊ縲∵里螳壹〒繝｡繝ｼ繝ｫ繝ｪ繝ｳ繧ｯ繧帝勁螟悶☆繧・
        with:
          args: >-
            --verbose --no-progress
            --max-redirects 5
            --timeout 20
            **/*.md
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  gtk4-sunset-monitor:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run GTK4 sunset monitor
        run: npx tsx tools/sunset/linkMonitor.ts --config tools/sunset/gtk4Links.config.ts --out reports
      - name: Upload GTK4 monitor report
        uses: actions/upload-artifact@v4
        with:
          name: gtk4-link-monitor
          path: reports

